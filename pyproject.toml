[project]
name = "llm-memory-bench"
version = "0.1.0"
description = "A framework for LLM agent memory experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "openai>=1.40",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[project.scripts]
lmb = "llm_memory_bench.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_memory_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is managed by `ruff format`; long prompt/string literals are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
